<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Analyzer - Estúdio de Trabalho</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #121416;
            --bg-surface: #1a1d21;
            --text-strong: #eceff3;
            --text-muted: #9199a3;
            --accent: #c18a3a;
            --line: #323840;
            --radius-xl: 12px;
            --radius-lg: 8px;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-base);
            color: var(--text-strong);
            font-family: 'Sora', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(160deg, #0f1215 0%, #161a20 45%, #121416 100%);
        }

        .top-bar {
            background: rgba(26, 29, 33, 0.95);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            margin: 16px 16px 0;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .control-dashboard {
            background: rgba(26, 29, 33, 0.6);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            margin: 12px 16px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            z-index: 90;
        }

        .group { display: flex; align-items: center; gap: 8px; }
        .divider { width: 1px; height: 30px; background: var(--line); margin: 0 10px; }

        .btn-transport {
            background: #252a31; border: 1px solid var(--line); color: var(--text-strong);
            min-width: 40px; height: 40px; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-family: 'IBM Plex Mono'; font-size: 11px;
        }
        .btn-transport:hover { background: #323841; }
        .btn-play { background: var(--accent); border: none; min-width: 120px; }

        .time-display { font-family: 'IBM Plex Mono'; font-size: 24px; color: var(--accent); min-width: 150px; text-align: center; }

        .lane-scroll-area { flex: 1; overflow-y: auto; padding: 0 16px; }

        #lane-stack {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }

        .playhead {
            position: absolute;
            top: 0;
            left: 400px;
            width: 2px;
            height: calc(100% - 20px);
            background: #fff;
            box-shadow: 0 0 12px #fff;
            z-index: 5;
            pointer-events: none;
        }

        .instrument-lane {
            min-height: 160px;
            background: rgba(28, 32, 38, 0.95);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            display: flex;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .lane-header {
            width: 260px;
            background: rgba(35, 39, 46, 0.8);
            border-right: 1px solid var(--line);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .lane-visual {
            flex: 1;
            position: relative;
            background-image: linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100px 100%;
        }

        .waveform-svg { width: 100%; height: 100%; display: flex; align-items: center; gap: 2px; padding: 0 20px; }
        .wave-bar { width: 3px; background: #4c5560; border-radius: 1px; }

        .master-footer {
            background: #14181d;
            border-top: 1px solid var(--line);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            gap: 40px;
            z-index: 200;
        }

        .pill-btn {
            background: #252a31; border: 1px solid var(--line); color: var(--text-muted);
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold;
        }
        .pill-btn:hover { color: white; border-color: var(--text-muted); }
        .pill-btn.active { color: var(--accent); border-color: var(--accent); }

    </style>
</head>
<body>

    <header class="top-bar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 32px; height: 32px; background: var(--accent); border-radius: 4px; display: grid; place-items: center; font-weight: bold; color:white;">MX</div>
            <strong>ESTÚDIO DE TRABALHO</strong>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="pill-btn">BIBLIOTECA</button>
        </div>
    </header>

    <section class="control-dashboard">
        <div class="group">
            <button class="btn-transport">|<<</button>
            <button class="btn-transport">-5s</button>
            <button class="btn-transport btn-play">REPRODUZIR</button>
            <button class="btn-transport">+5s</button>
            <button class="btn-transport">REPETIR</button>
        </div>

        <div class="time-display">00:14:812</div>

        <div class="divider"></div>

        <div class="group">
            <span style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-right: 5px;">PREDEFINIÇÕES:</span>
            <button class="pill-btn active">MIX PADRÃO</button>
            <button class="pill-btn">FOCO VOCAL</button>
            <button class="pill-btn">FOCO BATERIA</button>
            <button class="pill-btn">KARAOKÊ</button>
            <button class="pill-btn">REFORÇO GRAVES</button>
        </div>
    </section>

    <main class="lane-scroll-area">
        <div id="lane-stack">
            <div class="playhead" id="playhead"></div>

            <article class="instrument-lane">
                <div class="lane-header"><strong>Vocais</strong><button class="pill-btn">INSPETOR →</button></div>
                <div class="lane-visual"><div class="waveform-svg" id="wave-1"></div></div>
            </article>

            <article class="instrument-lane">
                <div class="lane-header"><strong style="color: #5ba17a;">Bateria</strong><button class="pill-btn">INSPETOR →</button></div>
                <div class="lane-visual"><div class="waveform-svg" id="wave-2"></div></div>
            </article>

            <article class="instrument-lane">
                <div class="lane-header"><strong>Baixo</strong><button class="pill-btn">ANALISADOR →</button></div>
                <div class="lane-visual"><div class="waveform-svg" id="wave-3"></div></div>
            </article>

            <article class="instrument-lane">
                <div class="lane-header"><strong>Outros</strong><button class="pill-btn">FERRAMENTAS →</button></div>
                <div class="lane-visual"><div class="waveform-svg" id="wave-4"></div></div>
            </article>
        </div>
    </main>

    <footer class="master-footer">
        <div style="font-family: 'IBM Plex Mono';">
            LUFS: <strong>-14.2</strong> | PICO: <strong style="color: #ba6b78;">-0.1 dB</strong>
        </div>
        <div style="font-size: 11px; color: var(--text-muted); margin-left: 20px;">
            SESSÃO: <strong>Neon_Sunset_Final.wav</strong>
        </div>
        <button style="margin-left:auto; background:var(--accent); border:none; color:white; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer;">EXPORTAR MIXAGEM</button>
    </footer>

    <script>
        function fillWave(id, count) {
            const container = document.getElementById(id);
            if(!container) return;
            for (let i = 0; i < count; i++) {
                const bar = document.createElement('div');
                bar.className = 'wave-bar';
                const h = (Math.random() * 70 + 5);
                bar.style.height = h + '%';
                if(h > 55) bar.style.background = '#c18a3a';
                container.appendChild(bar);
            }
        }
        for(let i=1; i<=4; i++) fillWave('wave-'+i, 400);

        let pos = 300;
        setInterval(() => {
            pos += 0.5;
            if(pos > window.innerWidth) pos = 260;
            const ph = document.getElementById('playhead');
            if(ph) ph.style.left = pos + 'px';
        }, 16);
    </script>
</body>
</html>
